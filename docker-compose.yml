services:
  golf-league:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/golf_league.db
      # SESSION_SECRET must come from the shell environment or an untracked
      # .env file next to this compose file. It is never baked into the
      # image or committed here.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set in the environment or a local .env file}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
