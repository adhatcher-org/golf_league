name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --frozen
    
    - name: Run tests
      run: |
        uv run pytest tests/ -v
    
    - name: Run linting
      run: |
        uv run ruff check .
    
    - name: Run coverage
      run: |
        uv run coverage run -m pytest tests/
        uv run coverage report