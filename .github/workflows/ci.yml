name: CI

on:
  push:
    branches: [ main, "reset/**" ]
  pull_request:
    branches: [ main, "reset/**" ]

permissions:
  contents: read

jobs:
  test:
    # Pinned: `ubuntu-latest` moves to Ubuntu 26 from 2026-10-19. Upgrade deliberately.
    runs-on: ubuntu-24.04
    # A full run takes about 5 minutes. Fail a stalled run here instead of after GitHub's 6 hours.
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --frozen --extra dev
    
    - name: Run checks
      run: |
        make check
