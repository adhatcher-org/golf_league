<tr data-handicap="{{ row.golfer.handicap if row.golfer.handicap is not none else '' }}">
    <th scope="row">{{ row.golfer.name }}{% if row.golfer.is_sub %} (sub){% endif %}</th>
    <td class="score-team score-team--{{ row.golfer.team_side }}">{{ row.golfer.team_name }}</td>
    <td class="score-position">{{ "ABCD"[row.golfer.position - 1] if row.golfer.position else "—" }}</td>
    {% for cell in row.inputs %}
    <td class="score-hole"><label class="visually-hidden" for="{{ cell.field }}">Hole {{ cell.hole }}, {{ row.golfer.name }}</label>
        <input class="score-input" type="text" inputmode="numeric" maxlength="2" autocomplete="off" id="{{ cell.field }}" name="{{ cell.field }}" value="{{ cell.value }}"{% if form_id %} form="{{ form_id }}"{% endif %}{% if cell.invalid %} aria-invalid="true"{% endif %}></td>
    {% endfor %}
    <td class="score-total">—</td>
    <td class="score-handicap">{{ row.golfer.handicap if row.golfer.handicap is not none else '—' }}</td>
    <td class="score-net">—</td>
</tr>
