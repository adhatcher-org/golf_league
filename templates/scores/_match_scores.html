<tr>
    <th scope="row">{{ row.golfer.name }}{% if row.golfer.is_sub %} (sub){% endif %}</th>
    {% for number in hole_numbers %}<td>{{ row.golfer.strokes_by_hole.get(number, '—') }}</td>{% endfor %}
    <td>{% if row.golfer.total is not none %}{{ row.golfer.total }}{% else %}—{% endif %}</td>
</tr>
