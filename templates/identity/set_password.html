<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set your password - Golf League</title>
</head>
<body>
    <main>
        <h1>Set your password</h1>
        {% if errors and errors.password %}<p class="error" role="alert">{{ errors.password }}</p>{% endif %}
        <form method="post" action="">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="password">New password</label>
            <input id="password" type="password" name="password" autocomplete="new-password" minlength="8">
            <button type="submit">Set password</button>
        </form>
    </main>
</body>
</html>
