{% extends "public_base.html" %}
{% block title %}Set your password - Golf League{% endblock %}
{% block content %}
<h1>Set your password</h1>
{% if errors and errors.password %}<p class="error" role="alert">{{ errors.password }}</p>{% endif %}
<form class="auth-form" method="post" action="">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">New password</label>
    <input id="password" type="password" name="password" autocomplete="new-password" minlength="8">
    <button type="submit">Set password</button>
</form>
<p><a href="/login">Back to log in</a></p>
{% endblock %}
