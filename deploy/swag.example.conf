## Golf League — SWAG subdomain proxy EXAMPLE ONLY.
##
## Copy to /config/nginx/proxy-confs/golfleague.subdomain.conf on the SWAG
## container and restart SWAG. It assumes the stock SWAG includes
## (ssl.conf, proxy.conf, resolver.conf) and that SWAG and the golf-league
## container share the Docker network named in deploy/compose.example.yml.
##
## SWAG's proxy.conf already sends:
##   X-Forwarded-For   $proxy_add_x_forwarded_for  (appends the real client)
##   X-Forwarded-Proto $scheme                     (https)
## The app (uvicorn) trusts those headers only from FORWARDED_ALLOW_IPS, the
## SWAG address, and takes the right-most untrusted address as the client.
## A client-supplied X-Forwarded-For therefore cannot choose its own address.
## Do not add a second X-Forwarded-For line that replaces the appended value.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name golfleague.*;

    include /config/nginx/ssl.conf;

    # Roster imports are capped at 2 MB of CSV per request by the app itself;
    # leave room for multipart overhead so the app, not nginx, gives the error.
    client_max_body_size 3m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app golf-league;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # The app does not yet mark its session/CSRF cookies Secure itself;
        # add the flag at the TLS edge (nginx >= 1.19.3, present in SWAG).
        proxy_cookie_flags ~ secure;
    }
}
